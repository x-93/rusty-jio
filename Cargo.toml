[workspace]
resolver = "2"
members = [
    "math",
    "utils",
    "core",
    "database",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared libraries that any of our crates can use
[workspace.dependencies]
thiserror = "1.0"
parking_lot = "0.12"
tokio = { version = "1.36", features = ["full"] }
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tempfile = "3.10"

# Internal workspace crates
jio-math = { path = "math" }
jio-utils = { path = "utils" }
jio-core = { path = "core" }
jio-database = { path = "database" }