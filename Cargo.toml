[workspace]
resolver = "2"
members = [
    "math",
    "utils",
    "crypto/hashes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Jio Developers"]
license = "MIT/Apache-2.0"
repository = "https://github.com/rusty-jio/rusty-jio"
include = ["src/**/*", "Cargo.toml", "build.rs"]

[workspace.dependencies]
jio-math = { path = "math" }
jio-utils = { path = "utils" }
jio-hashes = { path = "crypto/hashes" }

blake3 = { version = "1.8", default-features = false }
faster-hex = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
wasm-bindgen = "=0.2.97"
workflow-wasm = "0.18"
js-sys = "0.3"
