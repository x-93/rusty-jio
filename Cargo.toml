[workspace]
resolver = "2"
members = [
    "core",
    "wallet/core",
    "wallet/cli",
    "wallet/native",
    "wallet/wasm",
    "wallet/bip32",
    "consensus",
    "consensus/core",
    "consensus/notify",
    "consensus/pow",
    "jiopad",
    "simpa",
    "wasm",
    "math",
    "crypto/hashes",
    "crypto/muhash",
    "crypto/addresses",
    "crypto/merkle",
    "notify",
    "indexes/core",
    "indexes/processor",
    "indexes/utxoindex",
    "rpc/core",
    "rpc/service",
    "rpc/grpc/core",
    "rpc/grpc/client",
    "rpc/grpc/server",
    "rpc/macros",
    "rpc/wrpc/client",
    "rpc/wrpc/server",
    "rpc/wrpc/proxy",
    "rpc/wrpc/wasm",
    "mining",
    "protocol/p2p",
    "protocol/flows",
    "components/addressmanager",
    "components/connectionmanager",
    "components/consensusmanager",
    "database",
    "crypto/txscript",
    "crypto/txscript/errors",
    "testing/integration",
]

[workspace.package]
version = "0.1.0"
authors = ["Jio developers"]
license = "MIT/Apache-2.0"
edition = "2021"
include = ["src/**/*.rs", "Cargo.toml"]

[workspace.dependencies]

# not published
jio-addressmanager = { path = "components/addressmanager" }
jio-connectionmanager = { path = "components/connectionmanager" }
jio-consensusmanager = { path = "components/consensusmanager" }
jio-mining = { path = "mining" }
jio-p2p-flows = { path = "protocol/flows" }
jio-p2p-lib = { path = "protocol/p2p" }
jio-testing-integration = { path = "testing/integration" }
jio-utxoindex = { path = "indexes/utxoindex" }
jio-rpc-service = { version = "0.1.0", path = "rpc/service" }

# published
jio-addresses = { version = "0.1.0", path = "crypto/addresses" }
jio-bip32 = { version = "0.1.0", path = "wallet/bip32" }
jio-consensus = { version = "0.1.0", path = "consensus" }
jio-consensus-core = { version = "0.1.0", path = "consensus/core" }
jio-consensus-notify = { version = "0.1.0", path = "consensus/notify" }
jio-core = { version = "0.1.0", path = "core" }
jio-database = { version = "0.1.0", path = "database" }
jio-grpc-client = { version = "0.1.0", path = "rpc/grpc/client" }
jio-grpc-core = { version = "0.1.0", path = "rpc/grpc/core" }
jio-hashes = { version = "0.1.0", path = "crypto/hashes" }
jio-math = { version = "0.1.0", path = "math" }
jio-merkle = { version = "0.1.0", path = "crypto/merkle" }
jio-muhash = { version = "0.1.0", path = "crypto/muhash" }
jio-notify = { version = "0.1.0", path = "notify" }
jio-pow = { version = "0.1.0", path = "consensus/pow" }
jio-rpc-core = { version = "0.1.0", path = "rpc/core" }
jio-rpc-macros = { version = "0.1.0", path = "rpc/macros" }
jio-txscript = { version = "0.1.0", path = "crypto/txscript" }
jio-txscript-errors = { version = "0.1.0", path = "crypto/txscript/errors" }
jio-utils = { version = "0.1.0", path = "utils" }
jio-wallet-core = { version = "0.1.0", path = "wallet/core" }
jio-wasm = { version = "0.1.0", path = "wasm" }
jio-wrpc-client = { version = "0.1.0", path = "rpc/wrpc/client" }
jio-wrpc-wasm = { version = "0.1.0", path = "rpc/wrpc/wasm" }

# not published
jio-grpc-server = { path = "rpc/grpc/server" }
jio-index-core = { path = "indexes/core" }
jio-index-processor = { path = "indexes/processor" }
jio-wallet-cli = { path = "wallet/cli" }
jio-wallet-cli-native = { path = "wallet/native" }
jio-wallet-cli-wasm = { path = "wallet/wasm" }
jio-wrpc-proxy = { path = "rpc/wrpc/proxy" }
jio-wrpc-server = { path = "rpc/wrpc/server" }
jiopad = { path = "jiopad" }

# external
thiserror = "1"
faster-hex = "0.6"
itertools = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
tempfile = "3.3"
blake2b_simd = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
] }
futures = { version = "0.3" }
bincode = { version = "1", default-features = false }
tokio = { version = "1", features = ["sync","rt-multi-thread"] }
wasm-bindgen = "0.2"
criterion = { version = "0.4", default-features = false }
indexmap = "1.9"
parking_lot = "0.12"
smallvec = { version = "1.10", features = ["serde"] }
borsh = { version = "0.9.1", features = ["rc"] } # please keep this fixed
async-std = { version = "1.12", features = ['attributes'] }
async-channel = "1.8"
clap = { version = "4", features = ["derive", "string","cargo"] }
derive_more = "0.99"
log = "0.4"
cfg-if = "1.0"
rocksdb = "0.19"
num_cpus = "1.15"
async-trait = "0.1"
paste = "1.0"
regex = "1"
pad = "0.1"
convert_case = "0.5"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
protoc-bin-vendored = "3.3.0"

# bip32 dependencies
rand_core = { version = "0.6", features = ["std"] }
bs58 = { version = "0.4", features = ["check"], default-features = false}
hmac = {version = "0.12", default-features = false}
secp256k1 = { version = "0.24", features = ["global-context", "rand-std"] }
#sha2 = {version = "0.10", default-features = false}
zeroize = {version = "1", default-features = false, features=["alloc"]}
ripemd = {version = "0.1", default-features = false}
subtle = {version = "2", default-features = false}
once_cell = {version = "1"}
pbkdf2 = {version = "0.11", default-features = false}

# workflow dependencies
workflow-log = { version = "0.3.10" }
workflow-core = { version = "0.3.10" }
workflow-wasm = { version = "0.3.10" }
workflow-dom = { version = "0.3.10" }
workflow-rpc = { version = "0.3.11" }
workflow-terminal = { version = "0.3.10" }

# workflow-log = { path = "../workflow-rs/log" }
# workflow-core = { path = "../workflow-rs/core" }
# workflow-wasm = { path = "../workflow-rs/wasm" }
# workflow-dom = { path = "../workflow-rs/dom" }
# workflow-rpc = { path = "../workflow-rs/rpc" }
# workflow-terminal = { path = "../workflow-rs/terminal" }

