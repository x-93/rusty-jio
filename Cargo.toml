[workspace]
resolver = "2"
members = [
    "math",
    "utils",
    "core",
    "database",
    "crypto/hashes",
    "crypto/merkle",
    "crypto/addresses",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared libraries that any of our crates can use
[workspace.dependencies]
thiserror = "1.0"
parking_lot = "0.12"
tokio = { version = "1.36", features = ["full"] }
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tempfile = "3.10"
blake2b_simd = "1.0"
sha2 = "0.10"
once_cell = "1.19"
bech32 = "0.9"
triggered = "0.1"
faster-hex = "0.10"
smallvec = { version = "1.13", features = ["serde"] }
borsh = { version = "1.5", features = ["derive", "unstable__schema"] }

# Internal workspace crates
jio-math = { path = "math" }
jio-utils = { path = "utils" }
jio-core = { path = "core" }
jio-database = { path = "database" }
jio-hashes = { path = "crypto/hashes" }
jio-merkle = { path = "crypto/merkle" }
jio-addresses = { path = "crypto/addresses" }
