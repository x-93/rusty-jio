[workspace]
resolver = "2"
members = [
    "math",
    "crypto/hashes",
    "consensus/pow",
    "crypto/addresses",
    "crypto/merkle",
    "crypto/muhash",
    "crypto/txscript",
    "consensus/core",
    "database",
    "core",
    "utils",
    "consensus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["rusty-jio developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/x-93/rusty-jio.git"
include = ["src/**/*", "Cargo.toml"]

[workspace.dependencies]
# Serialization
serde        = { version = "1.0", features = ["derive", "rc"] }
borsh        = { version = "1.8", features = ["derive"] }
serde_json   = "1.0"
bincode      = "1.3"
faster-hex   = "0.10"            # DO NOT upgrade to 1.0 (breaking Error variants)
enum-primitive-derive = "0.3"
num-traits   = "0.2"
num_cpus     = "1.16"

# Storage
rocksdb      = { version = "0.22", default-features = false }
indexmap     = "2.7"
tempfile     = "3.14"

# Internal crates
jio-math           = { version = "0.1.0", path = "math" }
jio-hashes         = { version = "0.1.0", path = "crypto/hashes" }
jio-pow            = { version = "0.1.0", path = "consensus/pow" }
jio-addresses      = { version = "0.1.0", path = "crypto/addresses" }
jio-merkle         = { version = "0.1.0", path = "crypto/merkle" }
jio-muhash         = { version = "0.1.0", path = "crypto/muhash" }
jio-txscript       = { version = "0.1.0", path = "crypto/txscript" }
jio-consensus-core = { version = "0.1.0", path = "consensus/core" }
jio-database       = { version = "0.1.0", path = "database" }
jio-core           = { version = "0.1.0", path = "core" }
jio-utils          = { version = "0.1.0", path = "utils" }
jio-consensus      = { version = "0.1.0", path = "consensus" }

# Big integers (malachite)
malachite-base = "0.14"
malachite-nz   = "0.14"

# Hashing
blake2b_simd   = "1.0"
sha2           = "0.10"
sha3           = "0.10"          # cSHAKE256 for PoW hashers
keccak         = "0.1"           # Bare-metal Keccak-f[1600] for hyper-optimized PoW
blake3         = "1.8"           # Blake3 for PowB3Hash (custom PoW)
once_cell      = "1.20"

# Crypto
secp256k1    = { version = "0.29", features = ["rand-std", "global-context"] }
bech32       = "0.11"

# Async
tokio        = { version = "1", features = ["full"] }
futures      = "0.3"

# Parallelism
rayon        = "1.10"

# Utilities
thiserror    = "2.0"
log          = "0.4"
parking_lot  = "0.12"
itertools    = "0.12"
smallvec     = { version = "1.13", features = ["union", "const_generics", "serde"] }

# WASM
wasm-bindgen = "0.2"
js-sys       = "0.3"

# Testing
rand         = "0.8"
rand_chacha  = "0.3"
