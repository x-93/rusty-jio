[package]
name = "jio-math"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = ["serde", "borsh"]
serde = ["dep:serde"]
borsh = ["dep:borsh"]

[dependencies]
subtle = "2.6"
serde = { version = "1.0", features = ["derive"], optional = true }
borsh = { version = "1.5", features = ["derive", "unstable__schema"], optional = true }
thiserror = "1.0"
faster-hex = "0.10"
malachite-base = "0.4"
malachite-nz = "0.4"

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1.0"
