[package]
name = "jio-hashes"
description = "Jio hashing functions"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jio-utils.workspace = true
blake3.workspace = true
faster-hex = { workspace = true, features = ["alloc"] }
serde = { workspace = true, optional = true }
borsh.workspace = true
wasm-bindgen = { workspace = true, optional = true }
workflow-wasm = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["std"]
std = ["blake3/std", "faster-hex/std", "jio-utils/std", "borsh/std"]
serde = ["dep:serde", "jio-utils/serde"]
wasm = ["dep:wasm-bindgen", "dep:workflow-wasm"]