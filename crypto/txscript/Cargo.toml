[package]
name = "jio-txscript"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
jio-hashes = { path = "../hashes" }
jio-addresses = { path = "../addresses" }
secp256k1 = { version = "0.29", features = ["alloc", "global-context", "rand-std"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
borsh = { version = "1.5", features = ["derive"], optional = true }

[dev-dependencies]
rand = "0.8"

[features]
default = ["serde", "borsh"]
serde = ["dep:serde"]
borsh = ["dep:borsh"]
